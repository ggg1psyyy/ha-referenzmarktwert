# Home Assistant's manifest/translation/brand checks (hassfest) and the Marketplace (HACS) repository checks.
name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # weekly: catch changes in Home Assistant or the Marketplace rules
  workflow_dispatch:

permissions: {}

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
