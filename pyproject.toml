[project]
name = "ha-referenzmarktwert"
version = "0.0.0"
license = "MIT"
description = "Home Assistant integration: Austrian reference market value (Referenzmarktwert, § 13 EAG)"
requires-python = ">=3.14.2"

[dependency-groups]
dev = ["pytest-homeassistant-custom-component==0.13.375", "ruff"]  # pins homeassistant==2026.10.4, pytest, aiohttp

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: talks to the real APIs (opt-in: RMW_LIVE=1)",
    "backtest: the whole integration on recorded months (opt-in: RMW_BACKTEST=<cache dir>)",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
